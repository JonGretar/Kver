name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # GPUI Kit's wider graph can exhaust a hosted runner during test + Clippy
    # if both profiles retain debug info.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v5

      - name: Test release and update tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # Cache compiled dependencies on repeat Linux builds, not Kver's own
      # artifacts. Revisit if cache storage or save time outweighs the benefit.
      - name: Cache Linux Rust dependencies
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux GUI and software rendering libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan1 mesa-vulkan-drivers

      - name: Ensure macOS Metal toolchain is available
        if: runner.os == 'macOS'
        run: |
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Test all targets including headless visuals
        run: cargo +stable test --locked --all-targets --features screenshot

      - name: Lint all targets
        run: cargo +stable clippy --locked --all-targets --features screenshot -- -D warnings

      - name: Build normal GUI binary
        run: cargo +stable build --locked --bin kver

      - name: Build and inspect unsigned macOS app
        if: runner.os == 'macOS'
        run: |
          sh scripts/package-macos-app.sh

      - name: Upload captures for visual review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kver-captures-${{ matrix.os }}
          path: target/captures/*.png
          if-no-files-found: ignore
          retention-days: 7
