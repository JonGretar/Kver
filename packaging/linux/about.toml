# Target-specific license resolution, independent of the Windows graph.
accepted = [
    "MIT", "Apache-2.0", "0BSD", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception", "OFL-1.1", "MPL-2.0",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true

[private]
ignore = true

[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]
