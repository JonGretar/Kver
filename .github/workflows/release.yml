name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      KVER_UPDATE_PUBLIC_KEY: ${{ vars.KVER_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate update configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "Configure the SPARKLE_PRIVATE_KEY Actions secret."; exit 1; }
          python3 packaging/macos/update-metadata.py

      - name: Validate tag, package version, and dated changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/common/release-metadata.py --tag "$RELEASE_TAG"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Ensure macOS Metal toolchain is available
        run: |
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build and verify Apple silicon archive
        run: sh packaging/macos/package.sh

      - name: Sign update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 packaging/common/release-metadata.py --tag "$RELEASE_TAG")
          sdk=$(sh packaging/macos/fetch-sparkle.sh)
          updates="$RUNNER_TEMP/kver-updates"
          mkdir -p "$updates"
          cp "target/release/Kver-v${version}-macos-arm64.zip" "$updates/"
          # Keep the private key off disk and out of command-line arguments.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sdk/bin/generate_appcast" \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            -o "$updates/appcast.xml" "$updates"
          xcrun swift packaging/macos/verify-update-signatures.swift \
            "$updates/appcast.xml" "$updates/Kver-v${version}-macos-arm64.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 packaging/common/release-metadata.py --tag "$RELEASE_TAG")
          python3 packaging/common/release-metadata.py --tag "$RELEASE_TAG" --notes > "$RUNNER_TEMP/release-notes.md"
          printf '\nUnsigned Apple silicon macOS app. See the [download/security instructions](https://github.com/%s/blob/%s/README.md#install).\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          printf '\nThe Linux x86-64 archive (Ubuntu 24.04 baseline) and the experimental Windows x86-64 archive are added with checksums after their builds succeed. See the [Linux guide](https://github.com/%s/blob/%s/docs/linux.md) and [Windows guide](https://github.com/%s/blob/%s/docs/windows.md) for requirements and validation limits.\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            "target/release/Kver-v${version}-macos-arm64.zip" \
            "$RUNNER_TEMP/kver-updates/appcast.xml" \
            --verify-tag --latest --title "Kver $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  # Build Linux in parallel; only its upload waits for the public release.
  linux-archive:
    # The reusable workflow also has a dispatch-only recovery uploader.
    # Its build job uses contents: read in either mode.
    permissions:
      contents: write
    uses: ./.github/workflows/linux-archive.yml
    secrets:
      LINUX_UPDATE_PRIVATE_KEY: ${{ secrets.LINUX_UPDATE_PRIVATE_KEY }}

  publish-linux:
    needs: [release, linux-archive]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
      - name: Attach Linux archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="Kver-$RELEASE_TAG-linux-x86_64.tar.gz"
          sha256sum -c -- "$archive.sha256"
          assets=("$archive" "$archive.sha256")
          if [[ -f "$archive.sha256.sig" ]]; then assets+=("$archive.sha256.sig"); fi
          gh release upload --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" "${assets[@]}" --clobber

  windows-archive:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/windows-archive.yml
