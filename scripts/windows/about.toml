# Fail rather than silently omit a dependency with an unknown license.
accepted = [
    "MIT", "Apache-2.0", "0BSD", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception", "OFL-1.1", "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true

[private]
ignore = true
