name: Experimental Windows archive

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach Windows assets
        required: true
        type: string

permissions:
  contents: write

env:
  # Recovery may check out an older tag whose tooling used the Windows locale.
  PYTHONUTF8: '1'

jobs:
  archive:
    name: Experimental x86-64 MSVC ZIP (not native GUI acceptance)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare existing release for manual recovery
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag ref' }
          gh release view --repo "$env:GITHUB_REPOSITORY" -- "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Recovery requires an existing release' }
          git fetch --no-tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release source checkout failed' }
          python scripts/release-metadata.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed' }
          # Build the tagged source with the current notice policy only.
          git restore --source="$env:GITHUB_SHA" -- scripts/windows/about.toml
          if ($LASTEXITCODE -ne 0) { throw 'License policy restore failed' }
      - name: Initialize x64 MSVC and Windows SDK
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          # Persist only the changed developer environment, not reserved Actions variables.
          Get-ChildItem Env: | Where-Object {
            $_.Name -notmatch '^(GITHUB_|RUNNER_|NODE_OPTIONS$)' -and $before[$_.Name] -ne $_.Value
          } | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }
      - name: Install native stable Rust and packaging tools
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rust-docs
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          python -m pip install -r scripts/windows/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'PE inspection tool installation failed' }
          cargo +stable install cargo-about --locked --version 0.9.3 --features cli
          if ($LASTEXITCODE -ne 0) { throw 'License tool installation failed' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Test archive rejection checks
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_windows_package.py
      - name: Build, package and verify clean extraction
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload experimental archive and checksum to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = python scripts/release-metadata.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed' }
          gh release upload "$env:RELEASE_TAG" `
            "target/x86_64-pc-windows-msvc/release/Kver-v${version}-experimental-windows-x86_64.zip" `
            "target/x86_64-pc-windows-msvc/release/Kver-v${version}-experimental-windows-x86_64.zip.sha256" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
