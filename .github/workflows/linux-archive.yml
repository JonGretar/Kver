name: Experimental Linux archive

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach Linux assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    name: Experimental Ubuntu x86-64 tarball (not native GUI acceptance)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare existing release for manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          gh release view --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          git checkout --detach FETCH_HEAD
          python3 scripts/release-metadata.py --tag "$RELEASE_TAG"
          # Build the tagged source with the current notice policy only.
          git restore --source="$GITHUB_SHA" -- scripts/linux/about.toml
      - name: Install Ubuntu build and loader-inspection requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan1 mesa-vulkan-drivers libwayland-client0 libegl1 binutils \
            desktop-file-utils python3-gi
      - name: Install stable native Rust and license tool
        run: |
          rustup toolchain install stable --profile minimal --component rust-docs
          cargo +stable install cargo-about --locked --version 0.9.3 --features cli
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Test archive rejection checks
        run: python3 -m unittest discover -s scripts -p test_linux_package.py
      - name: Build, package and verify clean extraction
        run: sh scripts/package-linux.sh
      - name: Upload experimental archive and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version=$(python3 scripts/release-metadata.py --tag "$RELEASE_TAG")
          gh release upload "$RELEASE_TAG" \
            "target/x86_64-unknown-linux-gnu/release/Kver-v${version}-experimental-linux-x86_64.tar.gz" \
            "target/x86_64-unknown-linux-gnu/release/Kver-v${version}-experimental-linux-x86_64.tar.gz.sha256" \
            --clobber
