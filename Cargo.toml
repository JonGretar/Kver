[package]
name = "kver"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform"]
screenshot = ["gui", "gpui/test-support", "gpui_platform/test-support"]

[[bin]]
name = "kver"
path = "src/main.rs"
required-features = ["gui"]

[[test]]
name = "visual"
path = "tests/visual.rs"
harness = false # macOS Metal needs to initialize on the process main thread
required-features = ["screenshot"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false, features = ["font-kit"], optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "x11", "wayland"], optional = true }
hayro = "0.8.0"
