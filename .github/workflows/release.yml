name: macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag, package version, and dated changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-metadata.py --tag "$RELEASE_TAG"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Ensure macOS Metal toolchain is available
        run: |
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build and verify Apple silicon archive
        run: sh scripts/package-macos-app.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/release-metadata.py --tag "$RELEASE_TAG")
          python3 scripts/release-metadata.py --tag "$RELEASE_TAG" --notes > "$RUNNER_TEMP/release-notes.md"
          printf '\nUnsigned Apple silicon macOS app. See the [download/security instructions](https://github.com/%s/blob/%s/docs/macos-app.md).\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            "target/release/Kver-v${version}-macos-arm64.zip" \
            --verify-tag --title "Kver $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
