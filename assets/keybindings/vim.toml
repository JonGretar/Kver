# Complete Vim preset. Entries are ordered for shortcut/menu presentation.
# No bindings are inherited from Standard.

[[keyboard.bindings]]
keys = "cmd-o"
command = "open-pdf"
platform = "mac"
# Reader/Contents deliberately override Ctrl-O with history navigation.
# Elsewhere Ctrl-O opens a PDF; bare o remains Open in the reader.
[[keyboard.bindings]]
keys = "ctrl-o"
command = "open-pdf"
platform = ["linux", "windows"]
[[keyboard.bindings]]
keys = "cmd-shift-o"
command = "show-recent"
