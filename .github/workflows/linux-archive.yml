name: Linux archive

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach Linux assets
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive:
    name: Ubuntu x86-64 tarball (package verification)
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.archive-paths.outputs.filename }}
    env:
      PACKAGE_METADATA: packaging/common/release-metadata.py
      PACKAGE_TESTS: packaging/tests
      PACKAGE_ENTRY: packaging/linux/package.sh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare existing release for manual recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 packaging/common/prepare-archive-recovery.py linux "$RELEASE_TAG"
      - name: Install Ubuntu build and loader-inspection requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan1 mesa-vulkan-drivers libwayland-client0 libegl1 binutils \
            desktop-file-utils python3-gi
      - name: Install stable native Rust and license tool
        run: |
          rustup toolchain install stable --profile minimal --component rust-docs
          cargo +stable install cargo-about --locked --version 0.9.3 --features cli
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Test archive rejection checks
        run: python3 -m unittest discover -s "$PACKAGE_TESTS" -p test_linux_package.py
      - name: Build, package and verify clean extraction
        run: sh "$PACKAGE_ENTRY"
      - name: Locate verified Linux archive
        id: archive-paths
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version=$(python3 "$PACKAGE_METADATA" --tag "$RELEASE_TAG")
          release_dir=target/x86_64-unknown-linux-gnu/release
          archive="$release_dir/Kver-v${version}-linux-x86_64.tar.gz"
          # Recovery builds the tagged packager, which may use the old name.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ ! -f "$archive" ]; then
            archive="$release_dir/Kver-v${version}-experimental-linux-x86_64.tar.gz"
          fi
          test -f "$archive" && test -f "$archive.sha256" || exit 1
          printf 'path=%s\nfilename=%s\n' "$archive" "${archive##*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ${{ steps.archive-paths.outputs.path }}
            ${{ steps.archive-paths.outputs.path }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish-recovery:
    if: github.event_name == 'workflow_dispatch'
    needs: archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
      - name: Attach Linux archive to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          archive: ${{ needs.archive.outputs.filename }}
        run: |
          sha256sum -c -- "$archive.sha256"
          gh release upload --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
