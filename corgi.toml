# Local macOS Corgi build configuration. Cargo and Linux CI do not read this file.
# Corgi sandboxes compile-time reads outside Rust source files.
[extra-inputs]
kver = ["examples/readme-sample.pdf", "examples/field-guide.pdf", "assets/icons/png/128.png", "assets/keybindings/standard.toml", "assets/keybindings/vim.toml", "packaging/linux/update.py"]
