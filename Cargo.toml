[package]
name = "kver"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["gui"]
gui = ["dep:gpui"]

[[bin]]
name = "kver"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"], optional = true }
hayro = "0.8.0"
